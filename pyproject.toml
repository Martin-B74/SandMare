[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sandmare"
version = "0.1.0"
description = "Analyse de logiciel malveillant : approche dynamique et apprentissage automatique"
dependencies = [
    "python-dotenv>=1.0.0",
    "tensorflow>=2.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "black>=24.0",
    "ruff>=0.3",
]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["sandmare"]